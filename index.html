<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="TodoApp">
  <title>TodoApp</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
</head>
<body>
<div class="app">

  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-top">
      <div class="logo">✅ Todo<span>App</span></div>
      <button class="close-sidebar" onclick="toggleSidebar()">✕</button>
    </div>
    <nav>
      <button class="nav-btn actif" data-page="dashboard"   onclick="showPage('dashboard',this)"   data-i18n-nav="nav_dashboard"></button>
      <button class="nav-btn"       data-page="taches"      onclick="showPage('taches',this)"      data-i18n-nav="nav_tasks"></button>
      <button class="nav-btn"       data-page="semaine"     onclick="showPage('semaine',this)"     data-i18n-nav="nav_week"></button>
      <button class="nav-btn"       data-page="categories"  onclick="showPage('categories',this)"  data-i18n-nav="nav_categories"></button>
      <button class="nav-btn"       data-page="recurrentes" onclick="showPage('recurrentes',this)" data-i18n-nav="nav_recurring"></button>
      <button class="nav-btn"       data-page="pomodoro"    onclick="showPage('pomodoro',this)"    data-i18n-nav="nav_pomodoro"></button>
      <button class="nav-btn"       data-page="rappels"     onclick="showPage('rappels',this)"     data-i18n-nav="nav_reminders"></button>
      <button class="nav-btn"       data-page="collab"      onclick="showPage('collab',this)"      data-i18n-nav="nav_share"></button>
    </nav>
    <div class="sidebar-footer">
      <div class="lang-row">
        <button class="lang-btn actif" onclick="setLang('fr',this)">🇫🇷 FR</button>
        <button class="lang-btn"       onclick="setLang('en',this)">🇬🇧 EN</button>
        <button class="lang-btn"       onclick="setLang('es',this)">🇪🇸 ES</button>
      </div>
      <button id="theme-btn" onclick="toggleTheme()">🌙</button>
    </div>
  </aside>

  <div class="overlay" id="overlay" onclick="toggleSidebar()"></div>

  <div class="main-wrapper">
    <header class="topbar">
      <button class="burger" onclick="toggleSidebar()">☰</button>
      <span class="topbar-title" id="topbar-title"></span>
      <div class="topbar-right">
        <div class="pomo-mini" id="pomo-mini" style="display:none"
          onclick="showPage('pomodoro',document.querySelector('[data-page=pomodoro]'))">
          🍅 <span id="pomo-mini-time">25:00</span>
        </div>
        <div class="bell" onclick="showPage('rappels',null)">
          🔔<span class="bell-badge" id="bell-badge" style="display:none"></span>
        </div>
      </div>
    </header>

    <main class="main">

      <!-- DASHBOARD -->
      <div id="page-dashboard" class="page active">
        <div class="stats-grid">
          <div class="stat-card">       <div class="stat-val" id="s-total">0</div>  <div class="stat-lbl" data-i18n="stat_total"></div></div>
          <div class="stat-card green"> <div class="stat-val" id="s-faites">0</div> <div class="stat-lbl" data-i18n="stat_done"></div></div>
          <div class="stat-card orange"><div class="stat-val" id="s-actives">0</div><div class="stat-lbl" data-i18n="stat_active"></div></div>
          <div class="stat-card red">   <div class="stat-val" id="s-retard">0</div> <div class="stat-lbl" data-i18n="stat_late"></div></div>
        </div>
        <div class="progress-section">
          <div class="progress-label"><span data-i18n="progress_label"></span><span id="progress-pct">0%</span></div>
          <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
        </div>
        <div class="charts-grid">
          <div class="chart-card"><div class="chart-title" data-i18n="chart_split"></div><canvas id="chart-doughnut"></canvas></div>
          <div class="chart-card"><div class="chart-title" data-i18n="chart_priority"></div><canvas id="chart-bar"></canvas></div>
        </div>
        <div class="chart-card" style="margin-top:14px">
          <div class="chart-title" data-i18n="chart_activity"></div>
          <canvas id="chart-line"></canvas>
        </div>
      </div>

      <!-- TACHES -->
      <div id="page-taches" class="page">
        <div class="add-card">
          <div class="add-main-row">
            <input type="text" id="new-task" data-i18n-ph="task_placeholder" />
            <button class="btn-add" onclick="ajouterTache()" data-i18n="btn_add"></button>
          </div>
          <div class="add-options">
            <select id="priorite">
              <option value="normale" data-i18n="prio_normal"></option>
              <option value="haute"   data-i18n="prio_high"></option>
              <option value="basse"   data-i18n="prio_low"></option>
            </select>
            <select id="categorie-select"></select>
            <input type="date"  id="echeance" />
            <input type="time"  id="heure-rappel" data-i18n-title="hint_start" />
            <input type="time"  id="heure-fin"    data-i18n-title="hint_end" />
          </div>
          <div class="add-options">
            <input type="text" id="new-note" data-i18n-ph="note_placeholder" style="flex:1" />
            <label class="toggle-row">
              <input type="checkbox" id="is-recurrente">
              <span data-i18n="recurring_label"></span>
            </label>
          </div>

          <!-- BLOC RÉCURRENCE -->
          <div id="recur-bloc" style="display:none">
            <div class="recur-type-row">
              <button class="rt-btn actif" data-type="quotidien"    onclick="setRecurType('quotidien',this)"    data-i18n="rt_daily"></button>
              <button class="rt-btn"       data-type="hebdo"        onclick="setRecurType('hebdo',this)"        data-i18n="rt_weekly"></button>
              <button class="rt-btn"       data-type="mensuel"      onclick="setRecurType('mensuel',this)"      data-i18n="rt_monthly"></button>
              <button class="rt-btn"       data-type="personnalise" onclick="setRecurType('personnalise',this)" data-i18n="rt_custom"></button>
            </div>

            <!-- Combien de jours ? (perso uniquement) -->
            <div id="recur-nb-bloc" style="display:none">
              <div class="recur-hint" data-i18n="recur_nb_hint"></div>
              <div class="recur-nb-row">
                <input type="number" id="recurrence-jours" min="1" max="7" value="2" style="width:80px" oninput="majJoursCases()" />
                <span class="recur-unit" data-i18n="recur_days_unit"></span>
              </div>
            </div>

            <!-- Grille des jours (hebdo + perso) -->
            <div id="recur-jours-bloc" style="display:none">
              <div class="recur-hint" id="recur-jours-hint" data-i18n="recur_days_hint"></div>
              <div class="recur-jours-grid" id="recur-jours-grid">
                <label class="jour-btn" data-dow="1"><input type="checkbox" value="1"><span data-i18n="day_mon"></span></label>
                <label class="jour-btn" data-dow="2"><input type="checkbox" value="2"><span data-i18n="day_tue"></span></label>
                <label class="jour-btn" data-dow="3"><input type="checkbox" value="3"><span data-i18n="day_wed"></span></label>
                <label class="jour-btn" data-dow="4"><input type="checkbox" value="4"><span data-i18n="day_thu"></span></label>
                <label class="jour-btn" data-dow="5"><input type="checkbox" value="5"><span data-i18n="day_fri"></span></label>
                <label class="jour-btn" data-dow="6"><input type="checkbox" value="6"><span data-i18n="day_sat"></span></label>
                <label class="jour-btn" data-dow="0"><input type="checkbox" value="0"><span data-i18n="day_sun"></span></label>
              </div>
            </div>
          </div>

          <div class="search-row">
            <input type="text" id="recherche" data-i18n-ph="search_placeholder" oninput="afficher(filtreActif())" />
            <button class="btn-danger" onclick="supprimerTerminees()" data-i18n="btn_clear_done"></button>
          </div>
        </div>

        <div class="filtres-bar">
          <button class="actif" data-filtre="toutes"    onclick="setFiltre(this)" data-i18n="filter_all"></button>
          <button               data-filtre="actives"   onclick="setFiltre(this)" data-i18n="filter_active"></button>
          <button               data-filtre="terminees" onclick="setFiltre(this)" data-i18n="filter_done"></button>
          <button               data-filtre="haute"     onclick="setFiltre(this)" data-i18n="filter_urgent"></button>
          <button               data-filtre="retard"    onclick="setFiltre(this)" data-i18n="filter_late"></button>
        </div>
        <div id="cat-filtre-bar" style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px"></div>
        <ul id="liste-taches"></ul>
        <div class="compteur-bar"><span id="compteur"></span></div>
      </div>

      <!-- VUE SEMAINE -->
      <div id="page-semaine" class="page">
        <div class="semaine-nav">
          <button onclick="changerSemaine(-1)" data-i18n="week_prev"></button>
          <span id="semaine-label"></span>
          <button onclick="changerSemaine(1)"  data-i18n="week_next"></button>
        </div>
        <div id="semaine-grid" class="semaine-grid"></div>
      </div>

      <!-- CATEGORIES -->
      <div id="page-categories" class="page">
        <div class="add-card">
          <div class="add-main-row">
            <input type="text" id="new-cat-nom" data-i18n-ph="cat_placeholder" />
            <select id="new-cat-icon">
              <option value="📚">📚</option><option value="💻">💻</option>
              <option value="🎬">🎬</option><option value="🏠">🏠</option>
              <option value="🎯">🎯</option><option value="👁️">👁️</option>
              <option value="💪">💪</option><option value="🌱">🌱</option>
              <option value="🎵">🎵</option><option value="✈️">✈️</option>
            </select>
            <select id="new-cat-couleur">
              <option value="#8b5cf6">Violet</option>
              <option value="#1D9E75">Vert</option>
              <option value="#c9a84c">Or</option>
              <option value="#06b6d4">Cyan</option>
              <option value="#e24b4a">Rouge</option>
              <option value="#f59e0b">Ambre</option>
            </select>
            <button onclick="ajouterCategorie()" data-i18n="btn_create"></button>
          </div>
        </div>
        <div id="categories-list"></div>
      </div>

      <!-- RECURRENTES -->
      <div id="page-recurrentes" class="page">
        <div class="info-box" data-i18n="recur_info"></div>
        <div id="recurrentes-list"></div>
      </div>

      <!-- POMODORO -->
      <div id="page-pomodoro" class="page">
        <div class="pomo-container">
          <div class="pomo-header">
            <div class="pomo-mode-label" id="pomo-session-label"></div>
            <div class="pomo-sessions-count"><span data-i18n="pomo_sessions_today"></span> <span id="pomo-count">0</span></div>
          </div>
          <div class="pomo-circle-wrap">
            <svg class="pomo-svg" viewBox="0 0 200 200">
              <circle class="pomo-track"    cx="100" cy="100" r="88"/>
              <circle class="pomo-progress" cx="100" cy="100" r="88" id="pomo-circle"
                stroke-dasharray="553" stroke-dashoffset="553"/>
            </svg>
            <div class="pomo-center">
              <div class="pomo-time"  id="pomo-time">25:00</div>
              <div class="pomo-label" id="pomo-label"></div>
            </div>
          </div>
          <div class="pomo-controls">
            <button id="pomo-start-btn" class="pomo-btn"          onclick="pomoDemarrer()" data-i18n="pomo_start"></button>
            <button id="pomo-pause-btn" class="pomo-btn pomo-sec"  onclick="pomoPause()"   data-i18n="pomo_pause" style="display:none"></button>
            <button                     class="pomo-btn pomo-stop" onclick="pomoStop()"    data-i18n="pomo_stop"></button>
          </div>
          <div class="pomo-card">
            <div class="pomo-card-title" data-i18n="pomo_settings"></div>
            <div class="pomo-set-grid">
              <div class="pomo-set-item"><label data-i18n="pomo_work"></label>    <input type="number" id="pomo-work"     value="25" min="1"  max="90" onchange="pomoUpdateSettings()"/></div>
              <div class="pomo-set-item"><label data-i18n="pomo_short"></label>   <input type="number" id="pomo-short"    value="5"  min="1"  max="30" onchange="pomoUpdateSettings()"/></div>
              <div class="pomo-set-item"><label data-i18n="pomo_long"></label>    <input type="number" id="pomo-long"     value="15" min="5"  max="60" onchange="pomoUpdateSettings()"/></div>
              <div class="pomo-set-item"><label data-i18n="pomo_sessions"></label><input type="number" id="pomo-sessions" value="4"  min="2"  max="8"  onchange="pomoUpdateSettings()"/></div>
            </div>
          </div>
          <div class="pomo-card">
            <div class="pomo-card-title" data-i18n="pomo_linked_task"></div>
            <select id="pomo-tache-select" style="width:100%;margin-top:8px"></select>
          </div>
          <div class="pomo-card">
            <div class="pomo-card-title" data-i18n="pomo_history"></div>
            <div id="pomo-history-list"></div>
          </div>
        </div>
      </div>

      <!-- RAPPELS -->
      <div id="page-rappels" class="page">
        <div class="rappels-top">
          <p class="hint" data-i18n="reminders_hint"></p>
          <button class="btn-notif" id="btn-notif-perm" onclick="demanderPermissionNotifs()" data-i18n="btn_notif_enable"></button>
        </div>
        <div id="liste-rappels"></div>
      </div>

      <!-- PARTAGE -->
      <div id="page-collab" class="page">
        <div class="collab-hero">
          <div style="font-size:42px">🤝</div>
          <h2 data-i18n="share_title"></h2>
          <p  data-i18n="share_subtitle"></p>
        </div>
        <div class="collab-grid">
          <div class="collab-card">
            <div class="collab-card-title" data-i18n="export_title"></div>
            <button onclick="exporterTaches()" style="margin-top:10px;width:100%" data-i18n="export_json"></button>
            <button onclick="copierCode()"     style="margin-top:8px;width:100%;background:rgba(139,92,246,.15);border-color:rgba(139,92,246,.3);color:var(--accent2)" data-i18n="export_code"></button>
          </div>
          <div class="collab-card">
            <div class="collab-card-title" data-i18n="import_title"></div>
            <textarea id="import-code" data-i18n-ph="import_placeholder"></textarea>
            <button onclick="importerCode()"  style="margin-top:8px;width:100%" data-i18n="import_code_btn"></button>
            <input type="file" id="import-file" accept=".json" onchange="importerFichier()" style="display:none">
            <button onclick="document.getElementById('import-file').click()" style="margin-top:8px;width:100%;background:rgba(6,182,212,.1);border-color:rgba(6,182,212,.3);color:var(--accent3)" data-i18n="import_file_btn"></button>
          </div>
        </div>
        <div id="collab-status" style="margin-top:1rem;font-size:13px;color:var(--text-muted);text-align:center"></div>
      </div>

    </main>
  </div>
</div>

<!-- MODAL TACHE -->
<div id="modal-tache" class="modal-overlay" onclick="fermerModal(event)">
  <div class="modal-card">
    <div class="modal-header">
      <span class="modal-title" id="modal-titre"></span>
      <button class="modal-close" onclick="fermerModalBtn()">✕</button>
    </div>
    <div class="modal-body">
      <div class="modal-label" data-i18n="modal_note"></div>
      <textarea id="modal-note" rows="3"></textarea>

      <div class="modal-label" style="margin-top:14px" data-i18n="modal_subtasks"></div>
      <div id="modal-subtasks"></div>
      <div class="add-row" style="margin-top:8px">
        <input type="text" id="new-subtask" data-i18n-ph="subtask_placeholder" style="flex:1" />
        <button onclick="ajouterSousTache()" style="padding:10px 14px">+</button>
      </div>

      <div class="modal-label" style="margin-top:14px" data-i18n="modal_timer"></div>
      <div class="add-row">
        <input type="time" id="modal-heure-debut" style="flex:1"/>
        <span style="align-self:center;color:var(--text-muted);font-size:13px">→</span>
        <input type="time" id="modal-heure-fin"   style="flex:1"/>
        <button onclick="demarrerTimerModal()" style="padding:10px 14px" data-i18n="modal_start_timer"></button>
      </div>

      <div class="modal-label" style="margin-top:14px" data-i18n="modal_reschedule"></div>
      <div class="add-row">
        <input type="date" id="report-date" style="flex:1"/>
        <button onclick="reporterTache()" style="padding:10px 14px" data-i18n="modal_reschedule_btn"></button>
      </div>
    </div>
    <div class="modal-footer">
      <button onclick="sauvegarderModal()" data-i18n="modal_save"></button>
      <button onclick="fermerModalBtn()" class="btn-sec" data-i18n="modal_cancel"></button>
    </div>
  </div>
</div>

<!-- TIMER FLOTTANT -->
<div id="timer-floating" class="floating-panel" style="display:none">
  <div class="float-title" id="timer-ftitle">⏱</div>
  <div class="float-time"  id="timer-ftime">00:00:00</div>
  <div class="float-bar"><div class="float-fill" id="timer-fbar"></div></div>
  <div class="float-sub"   id="timer-fsub"></div>
  <div class="float-btns">
    <button onclick="pauseTimer()" id="timer-pause-btn" data-i18n="btn_pause"></button>
    <button onclick="stopTimer()"  class="btn-danger"   data-i18n="btn_stop"></button>
  </div>
</div>

<!-- CHRONO FLOTTANT -->
<div id="chrono-floating" class="floating-panel chrono-panel" style="display:none">
  <div class="float-title" data-i18n="chrono_title"></div>
  <div class="float-time"  id="chrono-time">00:00:00</div>
  <div class="chrono-laps" id="chrono-laps"></div>
  <div class="float-btns">
    <button onclick="chronoPause()" id="chrono-pause-btn" data-i18n="btn_pause"></button>
    <button onclick="chronoLap()"                         data-i18n="btn_lap"></button>
    <button onclick="chronoStop()" class="btn-danger"     data-i18n="btn_stop"></button>
  </div>
</div>

<div id="notif-toast" class="toast"></div>
<script src="app.js"></script>
</body>
</html>
